<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer | SportZone</title>

  <!-- CSS del footer -->
  <link rel="stylesheet" href="./css/footer.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome (íconos de redes y sobre) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <link rel="icon" type="image/png" href="./images/IconoSportZone.png">
</head>

<body>

  <footer class="site-footer">
    <div class="footer-topline"></div>

    <div class="container py-3">
      <div class="row align-items-center">
        <!-- Columna 1: logo -->
        <div class="col-md-4 text-center text-md-start">
          <img src="./images/IconoSportZone.png" alt="SportZone" class="footer-icono">
        </div>

        <!-- Columna 2: contacto -->
        <div class="col-md-4 text-center">
          <h5 class="footer-title">Contáctanos</h5>
          <p class="footer-email">
            <i class="fa-solid fa-envelope"></i>
            <a href="mailto:contacto@sportzone.mx">contacto@sportzone.mx</a>
          </p>
        </div>

        <!-- Columna 3: redes -->
        <div class="col-md-4 text-center text-md-end">
          <h5 class="footer-title text-center">Síguenos</h5>
          <ul class="footer-redes">
            <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
            <li><a href="#"><i class="fa-brands fa-facebook-f"></i></a></li>
            <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <small>&copy; 2025 SportZone. Todos los derechos reservados.</small>
    </div>
  </footer>

  <!-- Tu JS -->
  <script type="module" src="/js/main.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
</body>

</html>
